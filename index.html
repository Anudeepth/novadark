<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AFTER DARK</title>
    <!-- Triad Metadata: Visible, Searchable, Almost Invisible -->
    <meta name="description" content="NOVA AFTER DARK — Sometimes the most obvious thing isn't the important thing.">
    <meta name="clue:triad" content="There are three things here. One is visible. One is searchable. One is almost invisible.">
    <meta name="clue:repository" content="Unfinished things are kept in repositories. Check the versions left behind.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #040508;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle 650px at var(--mouse-x) var(--mouse-y), rgba(30, 42, 66, 0.45), transparent 75%),
                radial-gradient(ellipse 80% 50% at 50% 100%, rgba(15, 23, 42, 0.6), transparent);
            color: #f1f5f9;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 3rem 2rem;
            position: relative;
        }

        ::selection {
            background: rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        /* Ambient subtle grain */
        .ambient-noise {
            position: fixed;
            inset: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Main Container */
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex: 1;
            z-index: 2;
            user-select: none;
        }

        /* Hero Typography - Refined, sleek & understated */
        .title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            line-height: 1.2;
            margin-right: -0.28em; /* visual balance for letter-spacing */
            background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.12), 0 0 60px rgba(56, 189, 248, 0.15);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
        }

        .stage:hover .title {
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.35));
        }

        /* 1. The Visible Thing: Subtitle */
        .subtext {
            margin-top: 1.5rem;
            font-size: clamp(0.7rem, 1.4vw, 0.85rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(148, 163, 184, 0.45);
            font-weight: 300;
            transition: color 0.4s ease;
        }

        .stage:hover .subtext {
            color: rgba(226, 232, 240, 0.75);
        }

        /* 2. The Searchable Thing (Searchable via Ctrl+F / Screen Readers / DOM) */
        .searchable-layer {
            position: absolute;
            bottom: 4.5rem;
            font-size: 0.68rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(148, 163, 184, 0.18);
            z-index: 2;
            transition: color 0.4s ease;
        }

        .searchable-layer:hover {
            color: rgba(148, 163, 184, 0.6);
        }

        /* 3. The Almost Invisible Thing: Spectral Clue */
        .spectral-clue {
            color: #07090f; /* Nearly blends into dark canvas on desktop */
            font-size: clamp(0.72rem, 1.6vw, 0.82rem);
            letter-spacing: 0.2em;
            user-select: text;
            -webkit-user-select: text;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
            text-align: center;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        /* Illumination on Hover, Selection, Active Touch, or Tap Toggle */
        .spectral-clue:hover,
        .spectral-clue:active,
        .spectral-clue.illuminated,
        .spectral-clue::selection {
            color: #38bdf8 !important;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.85), 0 0 30px rgba(56, 189, 248, 0.45);
        }

        /* Mobile & Touch Device Adaptations */
        @media (hover: none) and (pointer: coarse) {
            .spectral-clue {
                /* Subtle hint on mobile touchscreens so users can tap to reveal */
                color: rgba(148, 163, 184, 0.08);
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 2rem 1.5rem;
            }
            .title {
                font-size: 1.35rem;
                letter-spacing: 0.22em;
                margin-right: -0.22em;
            }
            .subtext {
                font-size: 0.68rem;
                letter-spacing: 0.22em;
                margin-top: 1.25rem;
            }
            .searchable-layer {
                bottom: 4rem;
                font-size: 0.6rem;
                letter-spacing: 0.18em;
            }
            .spectral-clue {
                font-size: 0.7rem;
                letter-spacing: 0.14em;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-noise"></div>

    <!-- Central Stage: The Primary Visual Display -->
    <main class="stage">
        <h1 class="title">NOVA AFTER DARK</h1>
        <!-- 1. The Visible Thing -->
        <p class="subtext">Sometimes the most obvious thing isn't the important thing.</p>
    </main>

    <!-- 2. The Searchable Thing: Indexed for search -->
    <div class="searchable-layer" id="searchable-triad">
        <span>repository &bull; versions left behind &bull; triad protocol</span>
    </div>

    <!-- 3. The Almost Invisible Thing: Hidden in shadows, revealed on hover, select, or mobile tap -->
    <footer class="spectral-clue" id="almost-invisible-sound" role="button" tabindex="0" title="Tap or highlight to illuminate">
        echoing from the rooms like an unfinished sound.
    </footer>

    <script>
        const clue = document.getElementById('almost-invisible-sound');

        // Touch & Tap to illuminate for mobile screens (or click on desktop)
        function toggleClue() {
            clue.classList.toggle('illuminated');
        }

        clue.addEventListener('click', toggleClue);
        clue.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleClue();
            }
        });

        // Fluid cursor & touch illumination coordinates
        function updateGlow(clientX, clientY) {
            const x = ((clientX / window.innerWidth) * 100).toFixed(1);
            const y = ((clientY / window.innerHeight) * 100).toFixed(1);
            document.documentElement.style.setProperty('--mouse-x', `${x}%`);
            document.documentElement.style.setProperty('--mouse-y', `${y}%`);
        }

        window.addEventListener('pointermove', (e) => {
            updateGlow(e.clientX, e.clientY);
        }, { passive: true });

        // Direct Touch Drag / Tap support on Mobile
        window.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 0) {
                updateGlow(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length > 0) {
                updateGlow(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // Console clue verification
        console.log("%cNOVA AFTER DARK", "color: #38bdf8; font-size: 14px; font-weight: bold; letter-spacing: 2px;");
        console.log("%cUnfinished things are kept in repositories. Check the versions left behind.", "color: #94a3b8; font-style: italic;");
    </script>
</body>
</html>
